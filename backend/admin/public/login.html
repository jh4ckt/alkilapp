<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlkilApp Admin - Iniciar sesión</title>
<style>
:root{
  --primary:#0B2447; --primary-dark:#081a36; --accent:#FF6B5E; --accent-hover:#E85D4D;
  --bg:#F8FAFC; --card:#fff; --border:#E2E8F0; --muted:#64748B;
  --ok:#3AA37B; --bad:#DC2626; --shadow:0 4px 24px rgba(11,36,71,.12);
  --radius:16px; --radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary) 0%,#1E3A5F 100%);
  font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:var(--primary);
  padding:24px;
}
.login-card{
  width:100%;max-width:420px;background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:40px 36px;
}
.logo{text-align:center;margin-bottom:28px}
.logo svg{width:72px;height:72px}
.logo h1{font-size:28px;font-weight:700;color:var(--primary);margin-top:12px;letter-spacing:-0.5px}
.logo p{color:var(--muted);font-size:14px;margin-top:4px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--primary);margin-bottom:8px}
.form-group input{
  width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:var(--radius-sm);
  font-size:16px;color:var(--primary);transition:border-color .2s,box-shadow .2s;
  outline:none;
}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #ff6b5e33}
.form-group input::placeholder{color:var(--muted)}
.btn{width:100%;padding:14px 24px;border:0;border-radius:var(--radius-sm);
  font-size:15px;font-weight:600;color:#fff;cursor:pointer;transition:all .2s;
  background:linear-gradient(135deg,var(--accent),#E85D4D);
  box-shadow:0 4px 16px #ff6b5e40;}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px #ff6b5e50}
.btn:active{transform:translateY(0)}
.error{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:12px 16px;
  border-radius:var(--radius-sm);margin-bottom:20px;font-size:13px;display:none}
.error.show{display:block}
.footer{text-align:center;margin-top:28px;color:var(--muted);font-size:13px}
.footer a{color:var(--accent);text-decoration:none}
.footer a:hover{text-decoration:underline}
@media (prefers-color-scheme: dark){
  :root{--primary:#F1F5F9;--card:#1E293B;--bg:#0B2447;--border:#334155;--muted:#94A3B8}
}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <svg viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="108" height="108" rx="24" fill="#0B2447"/>
      <path fill="#FF6B5E" d="M54 32 L30 56 L34 56 L34 76 L74 76 L74 56 L78 56 Z M44 76 L44 62 L64 62 L64 76 Z"/>
    </svg>
    <h1>AlkilApp Admin</h1>
    <p>Panel de administración</p>
  </div>

  <div id="error" class="error"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="user">Usuario de administrador</label>
      <input type="text" id="user" name="user" placeholder="admin" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">Contraseña de administrador</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Ingresar al panel</button>
  </form>

  <div class="footer">
    <p>AlkilApp v1.43 · <a href="https://github.com/jh4ckt/alkilapp" target="_blank">GitHub</a></p>
  </div>
</div>

<script>
const form = document.getElementById('loginForm');
const errorEl = document.getElementById('error');
const userInput = document.getElementById('user');
const passwordInput = document.getElementById('password');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.classList.remove('show');
  const user = userInput.value.trim();
  const password = passwordInput.value.trim();
  if (!user) return showError('Ingresa el usuario de administrador');
  if (!password) return showError('Ingresa la contraseña');

  const btn = form.querySelector('button');
  btn.disabled = true; btn.textContent = 'Ingresando...';

  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ user, password }),
      credentials: 'include'
    });
    if (res.ok || res.redirected) {
      window.location.href = '/';
    } else {
      const text = await res.text();
      showError('Contraseña incorrecta');
    }
  } catch (err) {
    showError('Error de conexión. Intenta de nuevo.');
  } finally {
    btn.disabled = false; btn.textContent = 'Ingresar al panel';
  }
});

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.add('show');
  passwordInput.focus();
}
</script>
</body>
</html>
