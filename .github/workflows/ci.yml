name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

  backend:
    name: Backend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate lockfiles
        run: |
          (cd backend && npm ci)
          (cd backend/admin && npm ci)
          (cd functions && npm ci)
      - name: Syntax check server code
        run: |
          find backend functions -name "*.js" \
            -not -path "*/node_modules/*" \
            -not -path "*/public/*" \
            -not -name "prod-app.js" \
            -print0 | xargs -0 -n1 node --check
